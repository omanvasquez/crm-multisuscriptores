<!DOCTYPE html>
<html lang="es" class="dark" style="background-color: #020617; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="CRM Multi-Suscripciones - Panel de Control y Cobranzas" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS PWA Standalone Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Cobranzas" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <title>CRM Multi-Suscripciones | Oman Vásquez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('crm_theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var isDark = saved ? saved === 'dark' : !prefersLight;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#020617';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#f8fafc';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark, html.dark body {
        background-color: #020617;
        color: #f8fafc;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
